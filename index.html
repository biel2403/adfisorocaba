<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Links oficiais da igreja: cultos, localização, redes sociais, pedidos de oração e contribuições."
    />
    <meta property="og:title" content="Igreja - Links oficiais" />
    <meta
      property="og:description"
      content="Acesse cultos, localização, pedidos de oração, redes sociais e formas de contribuição."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#f4eee8" />
    <title>Igreja | Links oficiais</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="profile" aria-labelledby="church-name">
        <div class="avatar" aria-hidden="true">
          <img id="church-logo" alt="" />
          <span>IG</span>
        </div>

        <p class="eyebrow">Links oficiais</p>
        <h1 id="church-name">Nome da Igreja</h1>
        <p class="bio">
          Uma igreja para viver a fé em comunidade, servir com amor e anunciar
          Jesus.
        </p>

        <div class="service-strip" aria-label="Horários dos cultos">
          <span>Domingo - 19h</span>
          <span>Quarta - 20h</span>
        </div>
      </section>

      <section class="links-section" aria-label="Links principais">
        <div id="links-list" class="links-list"></div>
      </section>

      <section class="info-panel" aria-label="Informações rápidas">
        <div>
          <span class="info-label">Endereço</span>
          <strong id="church-address">Rua Exemplo, 123 - Sua Cidade</strong>
        </div>
        <button id="share-button" class="ghost-button" type="button">
          Compartilhar
        </button>
      </section>

      <footer>
        <span id="footer-text">© 2026 Nome da Igreja</span>
      </footer>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
